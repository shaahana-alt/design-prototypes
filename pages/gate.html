<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plot</title>
    <link rel="icon" href="./plot-logo.png" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #ede8e6;
        background: #000;
      }
      .gate {
        width: min(360px, calc(100vw - 48px));
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      .logo {
        display: block;
        width: 164px;
        height: auto;
        margin: 0 auto 40px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      label {
        font-size: 14px;
        font-weight: 600;
      }
      .field {
        position: relative;
      }
      input {
        width: 100%;
        height: 44px;
        padding: 0 44px 0 14px;
        border: 1px solid #3d2a28;
        border-radius: 8px;
        background: #111;
        font: inherit;
        font-size: 16px;
        color: #ede8e6;
      }
      input:focus {
        outline: 2px solid #ede8e6;
        outline-offset: 2px;
      }
      .toggle {
        position: absolute;
        top: 0;
        right: 0;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 0;
        background: transparent;
        color: #ede8e6;
        cursor: pointer;
      }
      .toggle svg {
        display: block;
      }
      .toggle .eye-off {
        display: none;
      }
      .toggle[aria-pressed="true"] .eye-on {
        display: none;
      }
      .toggle[aria-pressed="true"] .eye-off {
        display: block;
      }
      button[type="submit"] {
        height: 44px;
        border: 0;
        border-radius: 100px;
        background: #ede8e6;
        color: #230603;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button[type="submit"]:hover {
        background: #fff;
      }
      .error {
        min-height: 1.25em;
        margin: 0;
        font-size: 14px;
        color: #d4a39c;
      }
    </style>
  </head>
  <body>
    <div class="gate">
      <img class="logo" src="./plot-logo.png" width="164" height="43" alt="Plot" />
      <form id="gate" autocomplete="off">
        <label for="password">Password</label>
        <div class="field">
          <input id="password" name="password" type="password" autofocus />
          <button
            type="button"
            class="toggle"
            id="toggle"
            aria-label="Show password"
            aria-pressed="false"
            aria-controls="password"
          >
            <svg class="eye-on" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.6" />
              <circle cx="12" cy="12" r="3.25" stroke="currentColor" stroke-width="1.6" />
            </svg>
            <svg class="eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.6" />
              <circle cx="12" cy="12" r="3.25" stroke="currentColor" stroke-width="1.6" />
              <path d="M4 20 20 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <button type="submit">Enter</button>
        <p class="error" id="error" hidden>That password doesn’t match a prototype.</p>
      </form>
    </div>
    <script>
      const routes = {
        ipsy: "./main/",
        fabletics: "./fabletics/",
        lululemon: "./lululemon/",
      };
      const form = document.getElementById("gate");
      const input = document.getElementById("password");
      const toggle = document.getElementById("toggle");
      const error = document.getElementById("error");
      toggle.addEventListener("click", () => {
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        toggle.setAttribute("aria-pressed", String(show));
        toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const dest = routes[input.value.trim().toLowerCase()];
        if (!dest) {
          error.hidden = false;
          input.select();
          return;
        }
        window.location.href = dest;
      });
    </script>
  </body>
</html>
