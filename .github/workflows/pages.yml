name: Deploy to GitHub Pages

on:
  push:
    # github-pages environment only allows these branches to deploy.
    # lululemon and handoff are still built into their folders whenever this runs.
    branches: [main, fabletics]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build each branch into a subfolder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p site
          touch site/.nojekyll

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          git branch -r

          build_ref() {
            local branch="$1"
            local ref="$2"
            local work="${RUNNER_TEMP}/build-${branch}"
            echo "Building ${branch} from ${ref}"
            rm -rf "$work"
            git worktree add --detach "$work" "$ref"
            (
              cd "$work"
              npm ci
              npx vite build --base "/design-prototypes/${branch}/" --outDir dist
              test -f dist/index.html
              mkdir -p "${GITHUB_WORKSPACE}/site/${branch}"
              cp -R dist/. "${GITHUB_WORKSPACE}/site/${branch}/"
            )
            git worktree remove --force "$work" || rm -rf "$work"
          }

          built=0
          for branch in main fabletics lululemon handoff; do
            if git rev-parse --verify "origin/${branch}" >/dev/null 2>&1; then
              build_ref "$branch" "origin/${branch}"
              built=$((built + 1))
            else
              echo "Skipping ${branch} (no origin/${branch})"
            fi
          done

          if [ ! -d site/handoff ]; then
            echo "ERROR: handoff folder was not built" >&2
            exit 1
          fi

          if [ "$built" -eq 0 ]; then
            echo "ERROR: no prototypes built" >&2
            exit 1
          fi

          if git cat-file -e origin/lululemon:pages/gate.html 2>/dev/null; then
            git show origin/lululemon:pages/gate.html > site/index.html
            if git cat-file -e origin/lululemon:pages/plot-logo.png 2>/dev/null; then
              git show origin/lululemon:pages/plot-logo.png > site/plot-logo.png
            fi
          elif [ -f pages/gate.html ]; then
            cp pages/gate.html site/index.html
            if [ -f pages/plot-logo.png ]; then
              cp pages/plot-logo.png site/plot-logo.png
            fi
          else
            echo "ERROR: no password gate found" >&2
            exit 1
          fi

          echo "Built folders:"
          ls -la site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fabletics'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
